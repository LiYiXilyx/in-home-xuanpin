<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Temu 运营工具</title>
  <style>
    body{width:360px;margin:0;padding:18px;font:14px/1.5 system-ui,sans-serif;color:#111827;background:#fff}h1{font-size:18px;margin:0 0 6px}h2{font-size:15px}.category{color:#4B5563}.row{display:grid;grid-template-columns:105px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid #eee}.label{color:#666}.value{font-weight:600;word-break:break-all}.summary{display:grid;grid-template-columns:1fr 1fr;gap:7px}.summary div,.health{padding:8px;background:#EFF6FF;border:1px solid #BFDBFE;border-radius:7px}.summary span{display:block;color:#4B5563}.health{margin-top:10px}.health-row{display:flex;justify-content:space-between}button{width:100%;margin-top:10px;padding:10px;border:1px solid #2563EB;border-radius:7px;background:#2563EB;color:#fff;font-weight:700;cursor:pointer}button:disabled{border-color:#D1D5DB;background:#E5E7EB;color:#6B7280;cursor:not-allowed}.reason{margin:3px 0;color:#6B7280}#status,#catalog-status{margin-top:12px;padding:9px;border-radius:6px;background:#f4f6f8;min-height:42px}.yes{color:#188038}.no{color:#c5221f}details{margin-top:10px;border-top:1px solid #D1D5DB;padding-top:8px}summary{font-weight:700;color:#1E3A8A;cursor:pointer}dl{display:grid;grid-template-columns:110px 1fr;gap:4px;font-size:12px}dd{margin:0;word-break:break-all}
  </style>
</head>
<body>
  <section id="catalog-panel" hidden></section>
  <section id="review-panel">
    <h1>当前 Temu 商品</h1>
    <div class="row"><span class="label">goods_id</span><span class="value" id="goods-id">读取中…</span></div>
    <div class="row"><span class="label">匹配当前任务</span><span class="value" id="matched">读取中…</span></div>
    <div class="row"><span class="label">cutoff_date</span><span class="value" id="cutoff-date">—</span></div>
    <button id="start" type="button" disabled>开始采集</button>
  </section>
  <div id="status" role="status" aria-live="polite">正在检查当前页面和本地运营台…</div>
  <script src="catalog-operator-view-model.js"></script>
  <script src="catalog-popup-view.js"></script>
  <script src="popup.js"></script>
</body>
</html>
