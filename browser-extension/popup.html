<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Temu 评论采集</title>
  <style>
    body{width:330px;margin:0;padding:18px;font:14px/1.5 system-ui,sans-serif;color:#202124;background:#fff}h1{font-size:17px;margin:0 0 14px}.row{display:grid;grid-template-columns:105px 1fr;gap:8px;padding:7px 0;border-bottom:1px solid #eee}.label{color:#666}.value{font-weight:600;word-break:break-all}button{width:100%;margin-top:16px;padding:11px;border:0;border-radius:7px;background:#ff5a1f;color:#fff;font-weight:700;cursor:pointer}button:disabled{background:#aaa;cursor:not-allowed}#status{margin-top:12px;padding:9px;border-radius:6px;background:#f4f6f8;min-height:42px}.yes{color:#188038}.no{color:#c5221f}
  </style>
</head>
<body>
  <section id="catalog-panel" hidden>
    <h1>Manual Bind Passive Capture</h1>
    <div class="row"><span class="label">Category</span><span class="value" id="catalog-category">—</span></div>
    <div class="row"><span class="label">Campaign</span><span class="value" id="catalog-campaign">—</span></div>
    <div class="row"><span class="label">Profile</span><span class="value" id="catalog-profile">—</span></div>
    <div class="row"><span class="label">页面健康</span><span class="value" id="page-health">NOT_DETECTED</span></div>
    <div class="row"><span class="label">Bind 状态</span><span class="value" id="bind-status">UNBOUND</span></div>
    <div class="row"><span class="label">target / unique</span><span class="value" id="catalog-progress">0 / 0</span></div>
    <div class="row"><span class="label">新增/重复/失败</span><span class="value" id="catalog-counts">0 / 0 / 0</span></div>
    <div class="row"><span class="label">CAPTCHA/error</span><span class="value" id="catalog-error">—</span></div>
    <button id="detect-page" type="button">检测当前页面</button><button id="bind-page" type="button" disabled>绑定当前页面</button>
    <button id="capture-page" type="button" disabled>采集当前页面</button><button id="yingdao-export" type="button" disabled>导出影刀任务</button>
  </section>
  <section id="review-panel">
    <h1>当前 Temu 商品</h1>
    <div class="row"><span class="label">goods_id</span><span class="value" id="goods-id">读取中…</span></div>
    <div class="row"><span class="label">匹配当前任务</span><span class="value" id="matched">读取中…</span></div>
    <div class="row"><span class="label">cutoff_date</span><span class="value" id="cutoff-date">—</span></div>
    <button id="start" type="button" disabled>开始采集</button>
  </section>
  <div id="status" role="status" aria-live="polite">正在检查当前页面和本地运营台…</div>
  <script src="popup.js"></script>
</body>
</html>
