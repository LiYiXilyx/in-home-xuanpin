<!doctype html><html lang="zh"><meta charset="utf-8"><title>机会商品清单</title><style>body{font:15px/1.6 system-ui;background:#f4f7fa;color:#17324a;margin:24px}article{background:white;border:1px solid #dce4ec;padding:16px;margin:16px 0;border-radius:10px}button,select,input,textarea{padding:8px;margin:4px}a{color:#1469bc}textarea{width:60%;display:block}#notice{color:#a33}article{display:grid;grid-template-columns:260px minmax(0,1fr);gap:24px;align-items:start}.opportunity-picture{margin:0;min-width:0;padding:8px;border-right:1px solid #e6ecf2}.opportunity-picture a{display:block;margin-top:10px;font-size:13px}.opportunity-picture p{color:#718096;font-size:12px}.opportunity-frame{position:relative;width:240px;overflow:hidden;background:#f6f8fa;min-height:160px}.opportunity-details{min-width:0;overflow-wrap:anywhere}.opportunity-details h2{margin-top:8px}.opportunity-details textarea{width:min(100%,760px);box-sizing:border-box}.opportunity-full-image{display:block;max-width:240px;height:auto}@media(max-width:680px){article{grid-template-columns:1fr}.opportunity-picture{border-right:0;border-bottom:1px solid #e6ecf2;padding-bottom:16px}body{margin:14px}.opportunity-details textarea{width:100%;margin-left:0}}
</style><h1>机会商品清单</h1><p>先截图，再筛选保存；不要求完成比价。此清单独立于正式 Pool。截图引用原有本地文件，不重复下载。</p><p><a href="/auto">自动截图队列</a> · <a href="/">搜索结果</a> · <a href="http://127.0.0.1:37821/sourcing-review.html?run_id=yingdao_random5_v1_20260831_001">1688 候选复核</a></p><label>状态 <select id="filter"><option value="">全部</option><option value="OPPORTUNITY">有机会</option><option value="WATCH">待观察</option><option value="SKIP">跳过</option></select></label><label>搜索 <input id="search" placeholder="商品、标题、锚点、备注"></label><label><input type="checkbox" id="removed">显示已移除</label><p id="notice" role="status"></p><p id="count"></p><main id="list"></main><script>
const el=id=>document.getElementById(id),labels={OPPORTUNITY:'有机会',WATCH:'待观察',SKIP:'跳过'};let items=[];function text(parent,tag,value){const e=document.createElement(tag);e.textContent=value;parent.append(e);return e;}function link(parent,label,url){const a=text(parent,'a',label);a.href=url;a.target='_blank';a.rel='noopener';parent.append(document.createTextNode(' · '));}
async function update(body){const r=await fetch('/opportunities/update',{method:'POST',headers:{'Content-Type':'application/json','X-Pilot':'search-v1'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error);}
function render(){const q=el('search').value.toLowerCase(),visible=items.filter(x=>(el('removed').checked||!x.removed)&&(!el('filter').value||x.state===el('filter').value)&&JSON.stringify([x.goods_id,x.anchor,x.note,x.sources.map(s=>s.item.title)]).toLowerCase().includes(q));el('count').textContent='显示 '+visible.length+' 件 · 共 '+items.length+' 件（含已移除）';el('list').replaceChildren();if(!visible.length)text(el('list'),'p','暂无符合条件的记录。请在多屏统一列表勾选商品并保存。');for(const x of visible){const card=document.createElement('article'),a=document.createElement('div');a.className='opportunity-details';const sources=[...x.sources].sort((a,b)=>a.created.localeCompare(b.created)),i=sources.at(-1)?.item||{};text(a,'h2',i.title||x.goods_id);if(i.manual_revision)text(a,'p','含人工修正字段 · '+i.manual_corrected_at);text(a,'p','商品 '+x.goods_id+' · 1688 关联锚点 '+x.anchor+' · '+labels[x.state]+(x.removed?' · 已移除':''));const density=Number.isFinite(i.review_count)&&i.review_count>=0&&Number.isFinite(i.sales_count)&&i.sales_count>0?i.review_count/i.sales_count:null;text(a,'p','最新保存来源售价 '+(i.price==null?'待复核':i.price+' '+i.currency)+' · 销量 '+(i.sales_count??'未识别')+' · 评论 '+(i.review_count??'未识别')+' · 评论密度 '+(density==null?'无法计算':density.toFixed(4)));text(a,'p','创建 '+x.created+' · 更新 '+x.updated+'；各次采集字段保留在来源中，价格可能不同。');for(const s of sources){const p=text(a,'p',s.created+' · '+s.query+' · ');link(p,'原截图',s.screenshot);link(p,'原字段','/?id='+encodeURIComponent(s.run_id));}const state=document.createElement('select');state.setAttribute('aria-label','状态 '+x.goods_id);for(const [v,l] of Object.entries(labels)){const o=document.createElement('option');o.value=v;o.textContent=l;state.append(o);}state.value=x.state;a.append(state);const note=document.createElement('textarea');note.maxLength=2000;note.value=x.note;note.setAttribute('aria-label','备注 '+x.goods_id);a.append(note);for(const [action,label] of [['edit','保存状态和备注'],[x.removed?'restore':'remove',x.removed?'恢复':'移除']]){const b=text(a,'button',label);b.onclick=async()=>{b.disabled=true;try{await update({key:x.key,action,state:state.value,note:note.value});el('notice').textContent=label+'成功';await load();}catch(e){el('notice').textContent=e.message;b.disabled=false;}};}card.dataset.goodsId=x.goods_id;card.dataset.removed=String(Boolean(x.removed));card.append(productPicture(sources.at(-1),x.goods_id),a);el('list').append(card);}}

function productPicture(source,goodsId){
 const figure=document.createElement('figure');figure.className='opportunity-picture';
 if(!source?.run_id){text(figure,'p','暂无来源截图');return figure;}
 const url='/shots/'+encodeURIComponent(source.run_id),rect=source.item?.shot_rect;
 const valid=rect&&[rect.x,rect.y,rect.width,rect.height].every(Number.isFinite)&&rect.x>=0&&rect.y>=0&&rect.width>0&&rect.height>0&&rect.x+rect.width<=1.001&&rect.y+rect.height<=1.001;
 const frame=document.createElement('div'),img=document.createElement('img');img.src=url;img.loading='lazy';img.alt=valid?(source.item?.title||goodsId):'历史来源整屏截图（非单品裁图）';
 if(valid){frame.className='opportunity-frame';img.style.cssText='position:absolute;max-width:none;width:'+(100/rect.width)+'%;left:'+(-rect.x/rect.width*100)+'%;top:0';img.onload=()=>{const scale=240/(img.naturalWidth*rect.width);frame.style.height=(img.naturalHeight*rect.height*scale)+'px';frame.style.minHeight='0';img.style.top=(-img.naturalHeight*rect.y*scale)+'px';};}
 else{img.className='opportunity-full-image';}
 img.onerror=()=>{img.hidden=true;text(frame,'p','截图加载失败，可点击下方查看原图');};frame.append(img);figure.append(frame);
 if(!valid)text(figure,'p','旧记录没有单品坐标，暂显示来源整屏。');
 link(figure,'查看来源整屏',url);return figure;
}

async function load(){try{const r=await fetch('/opportunities/data'),d=await r.json();if(!r.ok)throw Error(d.error);items=d.items;render();}catch(e){el('notice').textContent=e.message;}}for(const id of ['filter','removed'])el(id).onchange=render;el('search').oninput=render;load();
</script><script src="/opportunity-reviews-ui.js" defer></script><script>(()=>{if(window.parent===window)return;const style=document.createElement('style');style.textContent='body{max-width:none!important;margin:0!important;padding:12px!important}body>h1{display:none}';document.head.append(style);document.addEventListener('click',e=>{const a=e.target.closest('a[href]');if(!a||e.ctrlKey||e.metaKey||e.shiftKey||e.altKey||e.button!==0)return;const u=new URL(a.href,location.href);if(u.origin===location.origin&&['/auto','/opportunities'].includes(u.pathname)){e.preventDefault();parent.postMessage({type:'pilot-navigate',view:u.pathname.slice(1)},'http://127.0.0.1:37821');}});})();</script></html>
