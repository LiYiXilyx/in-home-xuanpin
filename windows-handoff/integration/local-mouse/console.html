<!doctype html><meta charset="utf-8"><title>本地鼠标采集控制</title>
<style>body{font:16px/1.6 sans-serif;color:#203447;padding:16px;background:#f1f6fc}button{padding:10px 18px;margin:5px;background:#1769d2;color:white;border:0;border-radius:5px}button:disabled{opacity:.4}pre{white-space:pre-wrap}.alert{background:#fff0d9;border:2px solid #df8300}</style>
<h3>本地鼠标采集 · 进度与控制</h3><p>打开对应的VMLogin商品列表，点击检查并开始，5秒内切回商品页。系统自动检测、核对任务并绑定；最长24小时，人工等待不计时。</p><p id="task-context">读取当前任务…</p><p id="metrics"></p>
<label>VMLogin配置ID <input id="profile" size="39"></label><label>本轮新增目标 <input id="target" type="number" min="1" max="2000" value="2000" style="width:80px"></label><button id="start" disabled>开始采集</button><br><strong id="summary">读取状态…</strong><pre id="reason"></pre>
<button id="pause">暂停</button><button id="resume">人工已处理，继续</button><button id="stop">结束本轮</button><p id="feedback"></p>
<script>
let state={},last='';const q=id=>document.getElementById(id);q('profile').value=localStorage.localMouseProfile||'90D7A598-9FAD-4FDB-B386-9C1860076EEB';
async function poll(){try{const r=await fetch('/status');if(!r.ok)throw Error('状态服务暂不可用');state=await r.json();const waiting=state.state==='WAITING_HUMAN',active=['STARTING','RUNNING','WAITING_HUMAN'].includes(state.state);q('summary').textContent=({IDLE:'尚未启动',STARTING:'启动中',RUNNING:'正在采集',WAITING_HUMAN:'需要人工处理',COMPLETED:'完成',STOPPED:'已结束',FAILED:'异常结束'})[state.state]+' · 本次运行增加 '+(state.added||0)+' 件';q('reason').textContent=state.message||'';document.body.className=waiting||state.state==='FAILED'?'alert':'';document.title=waiting?'【待处理】本地鼠标采集':'本地鼠标采集控制';q('start').disabled=active;q('pause').disabled=state.state!=='RUNNING';q('resume').disabled=!waiting;q('stop').disabled=!active;last=state.state;}catch(e){q('summary').textContent=e.message;for(const a of ['start','pause','resume','stop'])q(a).disabled=true;}}
for(const action of ['pause','resume','stop'])q(action).onclick=async()=>{try{const r=await fetch('/command',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,id:state.id})});const s=await r.json();if(!r.ok)throw Error(s.message);q('feedback').textContent=action==='resume'?'已发送，5秒内切回VMLogin商品页':'已发送，当前页面检查完成后生效';}catch(e){q('feedback').textContent=e.message;}};
q('start').onclick=async()=>{q('start').disabled=true;try{const profile=q('profile').value.trim();const r=await fetch('/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profile,target:Number(q('target').value)})});const s=await r.json();if(!r.ok)throw Error(s.message);localStorage.localMouseProfile=profile;q('feedback').textContent='已启动，5秒内切回商品页';await poll();}catch(e){q('feedback').textContent=e.message;q('start').disabled=false;}};poll();setInterval(poll,1500);
</script>
<script>
let context=null;
const targetLabel=q('target').closest('label');q('start').textContent='检查并开始采集';
async function loadContext(){const r=await fetch('/context');const d=await r.json();if(!r.ok)throw Error(d.message);context=d;q('task-context').textContent='当前任务：'+d.task.name+' · '+d.task.purpose;targetLabel.hidden=d.mode==='recapture';const m=d.metrics;q('metrics').textContent=m?'本任务采到 '+m.capturedCount+' 件 · 已有商品覆盖 '+m.covered+' / '+m.previousCount+' 件 · 本池新品 '+m.added+' 件（尚未合并）':'本任务已采 '+d.task.count+' 件；下方本轮数量表示这次运行增加的任务记录，不等于正式池新品。';return d;}
const originalPoll=poll;poll=async()=>{await originalPoll();q('summary').textContent=q('summary').textContent.replace('本轮新增','本次运行增加');};
q('start').onclick=async()=>{q('start').disabled=true;try{if(!context)throw Error('请等待当前任务加载');const expected=context.task.id;const latest=await loadContext();if(expected!==latest.task.id)throw Error('任务已切换，请核对上方名称后重新点击');const profile=q('profile').value.trim();const r=await fetch('/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({profile,target:Number(q('target').value),campaign_id:expected})});const d=await r.json();if(!r.ok)throw Error(d.message);localStorage.localMouseProfile=profile;q('feedback').textContent='已启动检查，5秒内切回商品页；检测通过后自动绑定并采集';await poll();}catch(e){q('feedback').textContent=e.message;q('start').disabled=false;}};
loadContext().catch(e=>q('task-context').textContent=e.message);setInterval(()=>loadContext().catch(e=>q('task-context').textContent=e.message),5000);
</script>
